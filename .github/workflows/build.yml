name: Build Mubeen AI (Windows Single EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Stable Production Dependencies
      run: |
        python -m pip install --upgrade pip
        # Switched to stable sounddevice to ensure seamless compilation across virtual matrix
        pip install pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32 comtypes sounddevice soundfile

    - name: Compile to Stable Onefile EXE
      run: |
        pyinstaller --onefile --noconsole --hidden-import=pyttsx3.drivers --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=comtypes --name "MubeenAI" main.py

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI.exe
