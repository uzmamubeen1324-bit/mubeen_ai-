name: Build Mubeen AI (EXE & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32 comtypes

    - name: Compile to Stable Production Folder
      run: |
        # Re-adding dynamic link layers to prevent hidden execution crashes
        pyinstaller --onedir --nowindowed --hidden-import=tkinter --hidden-import=pyttsx3.drivers --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=comtypes --name "MubeenAI" main.py

    - name: Compress Directory into ZIP Archive
      shell: powershell
      run: |
        Compress-Archive -Path dist/MubeenAI -DestinationPath dist/MubeenAI-Windows.zip

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI-Windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Android APK with Official Action
      uses: ArtemGovorov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer -v android debug

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Android-APK
        path: bin/*.apk
