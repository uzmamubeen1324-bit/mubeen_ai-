name: Build Mubeen AI (EXE & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installing PyAudio directly for Windows to capture microphone streams cleanly
        pip install pyaudio pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32

    - name: Compile to EXE
      run: |
        pyinstaller --onefile --windowed --name "MubeenAI" main.py

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev
        pip install --upgrade pip
        pip install buildozer cython kivy

    - name: Generate and Configure Buildozer Spec
      run: |
        buildozer init
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/source.dir = ./source.dir = mobile_app/' buildozer.spec

    - name: Auto-Accept Android Licenses & Compile to APK
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer -v android debug
        
    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Android-APK
        path: bin/*.apk
