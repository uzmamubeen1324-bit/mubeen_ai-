name: Build Mubeen AI (Windows Single EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Build Prerequisites
      run: |
        python -m pip install --upgrade pip
        # Installs setup tools to safely process audio extensions on virtual servers
        pip install setuptools wheel pipwin pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32 comtypes

    - name: Pre-compile Microphone Binary Core
      run: |
        # Using automated pre-built wheels to bypass virtual C++ compiler errors completely
        pipwin refresh
        pipwin install pyaudio

    - name: Compile to Stable Onefile EXE
      run: |
        pyinstaller --onefile --hidden-import=pyttsx3.drivers --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=comtypes --name "MubeenAI" main.py

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI.exe
