name: Build Mubeen AI (EXE & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaudio pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32 comtypes

    - name: Compile to EXE with Hidden Drivers
      run: |
        pyinstaller --onefile --noconsole --hidden-import=pyttsx3.drivers --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=comtypes --name "MubeenAI" main.py

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI.exe

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev
        pip install --upgrade pip
        pip install buildozer cython kivy

    - name: Generate and Configure Buildozer Spec
      run: |
        buildozer init
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/source.dir = ./source.dir = mobile_app/' buildozer.spec

    - name: Native Linux Android Compilation
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        export BUILDOZER_ALLOW_ORG_INDEX_URL=1
        yes | buildozer -v android debug

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Android-APK
        path: bin/*.apk
