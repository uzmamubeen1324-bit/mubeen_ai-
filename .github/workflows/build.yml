
```yaml
name: Build Mubeen AI (EXE & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaudio pyinstaller pyautogui opencv-python Pillow pyttsx3 SpeechRecognition pywin32 comtypes

    - name: Compile to Standalone Single EXE File
      run: |
        # Compiled to --onefile with standard console window to debug initialization paths
        pyinstaller --onefile --hidden-import=pyttsx3.drivers --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=comtypes --name "MubeenAI" main.py

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MubeenAI-Windows-EXE
        path: dist/MubeenAI.exe
